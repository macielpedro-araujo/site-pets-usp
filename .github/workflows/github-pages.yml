# Publica o site no GitHub Pages a cada push na main (versão de teste, no modo local, sem banco).
# Antes da primeira vez: Settings → Pages → Source: "GitHub Actions".
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # O site fica em https://<usuario>.github.io/<repositorio>/
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # O Pages não tem "rewrite" de SPA: o 404.html (cópia do index) faz
      # as rotas como /pets/computacao funcionarem ao recarregar a página
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
